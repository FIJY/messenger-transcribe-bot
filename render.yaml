# render.yaml
services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    env: python
    plan: starter # <-- ИЗМЕНЕНИЕ: $7/месяц вместо $25
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "hypercorn app:app --bind 0.0.0.0:${PORT}"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: variables_bot
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 2. Воркер Celery
  - type: worker
    name: celery-worker
    env: python
    plan: starter # <-- ИЗМЕНЕНИЕ: $7/месяц вместо $25
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "celery -A celery_worker.celery_app worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: variables_bot
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 3. Redis
  - type: redis
    name: bot-redis
    plan: free # <-- Redis остается бесплатным
    ipAllowList: []