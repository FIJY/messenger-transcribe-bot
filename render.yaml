# render.yaml - Версия, использующая Docker для сборки
services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    env: docker
    # Явно указываем команду запуска, чтобы удовлетворить требование Render
    startCommand: "sh -c 'tor & sleep 5 && exec python main.py'"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 2. Celery воркер
  - type: worker
    name: celery-worker
    env: docker
    # startCommand здесь остается, так как он отличается от веб-сервиса
    startCommand: "celery -A services.transcription.celery_app worker --loglevel=info --concurrency=1"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 3. Redis
  - type: redis
    name: bot-redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections
