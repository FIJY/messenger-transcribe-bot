services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    env: docker
    plan: standard
    envVarGroups:
      - name: variables_bot
    # ИЗМЕНЕНИЕ: Явно подключаем REDIS_URL напрямую из сервиса Redis
    envVars:
      - key: PROCESS_TYPE
        value: web
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 2. Воркер Celery
  - type: worker
    name: celery-worker
    env: docker
    plan: standard
    envVarGroups:
      - name: variables_bot
    # ИЗМЕНЕНИЕ: Явно подключаем REDIS_URL напрямую из сервиса Redis
    envVars:
      - key: PROCESS_TYPE
        value: worker
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 3. Планировщик Celery
  - type: worker
    name: celery-beat
    env: docker
    plan: standard
    envVarGroups:
      - name: variables_bot
    # ИЗМЕНЕНИЕ: Явно подключаем REDIS_URL напрямую из сервиса Redis
    envVars:
      - key: PROCESS_TYPE
        value: beat
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 4. Redis
  - type: redis
    name: bot-redis
    plan: free
    ipAllowList: []
