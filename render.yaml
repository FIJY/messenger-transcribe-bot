services:
  - type: web
    name: messenger-transcribe-bot
    env: docker
    region: oregon
    buildCommand: "apt-get update && apt-get install -y tor ffmpeg curl && pip install -r requirements.txt"
    startCommand: "bash -c 'echo Starting Tor... && tor --RunAsDaemon 1 --SocksPort 9050 --Log notice stdout && sleep 15 && echo Starting app... && python main.py'"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString
      - key: USE_TOR
        value: "true"
      - key: YT_PROXY
        value: "socks5://127.0.0.1:9050"
      - key: PYTHONPATH
        value: "/opt/render/project/src"

  - type: worker
    name: celery-worker  
    env: python3
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A services.transcription.celery_app worker --loglevel=info --concurrency=1"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString
      - key: PYTHONPATH
        value: "/opt/render/project/src"

  - type: redis
    name: bot-redis
    maxmemoryPolicy: allkeys-lru