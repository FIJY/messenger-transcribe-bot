# render.yaml - Обновленная версия с правильной командой запуска
services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    env: docker
    # УБИРАЕМ startCommand чтобы использовать CMD из Dockerfile
    # Или явно указываем правильную команду:
    # startCommand: "/app/start.sh"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString
      - key: USE_TOR
        value: "true"
      - key: YT_PROXY
        value: "socks5://127.0.0.1:9050"

  # 2. Celery воркер
  - type: worker
    name: celery-worker
    env: docker
    startCommand: "celery -A services.transcription.celery_app worker --loglevel=info --concurrency=1"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 3. Redis
  - type: redis
    name: bot-redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections