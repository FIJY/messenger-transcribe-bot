# render.yaml
services:
  # 1. Веб-сервис для обработки веб-хуков Telegram
  - type: web
    name: messenger-transcribe-bot
    env: python
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: variables_bot
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 2. Celery Worker - ИСПРАВЛЕНО
  - type: worker
    name: celery-worker
    env: python
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "celery -A tasks.transcription.celery_app worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: variables_bot
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  # 3. Redis для очереди задач Celery
  - type: redis
    name: bot-redis
    plan: free
    ipAllowList: []