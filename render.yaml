# render.yaml - ИСПРАВЛЕНО: только веб-сервис без Celery
services:
  # Только основной веб-сервис (без Celery worker пока)
  - type: web
    name: messenger-transcribe-bot
    env: python
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - fromGroup: variables_bot