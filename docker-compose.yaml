# docker-compose.yml - Локальное развертывание с ограничениями ресурсов
version: '3.8'

services:
  # Redis для Celery
  redis:
    image: redis:7-alpine
    container_name: transcribe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: transcribe_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.5'

  # Веб-приложение (FastAPI)
  web:
    build: .
    container_name: transcribe_web
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongodb
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/transcribe_bot_db?authSource=admin
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_URL=${WEBHOOK_URL}
      - DEBUG=true
      - MAX_FILE_SIZE_MB=25
      - MAX_DURATION_MINUTES=10
    volumes:
      - ./logs:/app/logs
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build: .
    container_name: transcribe_worker
    depends_on:
      - redis
      - mongodb
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/transcribe_bot_db?authSource=admin
      - REDIS_URL=redis://redis:6379
      - DEBUG=true
      - MAX_FILE_SIZE_MB=25
      - MAX_DURATION_MINUTES=10
      - CELERY_WORKER_CONCURRENCY=2
      - CELERY_WORKER_MAX_MEMORY=400000  # 400MB в KB
    volumes:
      - ./logs:/app/logs
      - /tmp:/tmp  # Для временных файлов
    command: >
      celery -A services.transcription.celery_app worker 
      --loglevel=info 
      --concurrency=2 
      --max-tasks-per-child=20 
      --max-memory-per-child=400000
      --without-gossip 
      --without-mingle 
      --without-heartbeat
    healthcheck:
      test: ["CMD", "celery", "-A", "services.transcription.celery_app", "inspect", "ping"]
      interval: 60s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M  # Лимит контейнера
          cpus: '1.5'
        reservations:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  # Celery Flower для мониторинга (опционально)
  celery-flower:
    build: .
    container_name: transcribe_flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
    command: >
      celery -A services.transcription.celery_app flower 
      --port=5555 
      --broker=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

volumes:
  redis_data:
  mongodb_data:
  logs:

networks:
  default:
    driver: bridge