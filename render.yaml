services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    env: python
    plan: starter
    # ИЗМЕНЕНИЕ: Принудительно обновляем yt-dlp до последней версии перед установкой.
    buildCommand: "pip install --upgrade yt-dlp && pip install -r requirements.txt"
    startCommand: "hypercorn app:app -b 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  # 2. Воркер Celery, который выполняет скачивание
  - type: worker
    name: celery-worker
    env: python
    plan: starter
    # ИЗМЕНЕНИЕ: Принудительно обновляем yt-dlp и здесь.
    buildCommand: "pip install --upgrade yt-dlp && pip install -r requirements.txt"
    startCommand: "celery -A celery_worker.celery_app worker --loglevel=info -c 1 --pool=solo"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  # 3. Планировщик Celery
  - type: worker
    name: celery-beat
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A celery_worker.celery_app beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  # 4. Redis
  - type: redis
    name: bot-redis
    plan: free
    ipAllowList: []
