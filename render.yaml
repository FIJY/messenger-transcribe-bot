services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    # ИЗМЕНЕНИЕ: Указываем, что нужно использовать Docker
    env: docker
    # ИЗМЕНЕНИЕ: План повышен до 'Standard' для увеличения лимитов (RAM/CPU)
    plan: standard
    # buildCommand и envVars для Python больше не нужны
    # Render будет использовать startCommand для запуска контейнера
    startCommand: "hypercorn app:app -b 0.0.0.0:$PORT"

  # 2. Воркер Celery, который выполняет скачивание
  - type: worker
    name: celery-worker
    # ИЗМЕНЕНИЕ: Указываем, что нужно использовать Docker
    env: docker
    # ИЗМЕНЕНИЕ: План повышен до 'Standard' для увеличения производительности
    plan: standard
    startCommand: "celery -A celery_worker.celery_app worker --loglevel=info -c 1 --pool=solo"

  # 3. Планировщик Celery (ему не нужен ffmpeg, оставляем как есть)
  - type: worker
    name: celery-beat
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A celery_worker.celery_app beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  # 4. Redis
  - type: redis
    name: bot-redis
    plan: free
    ipAllowList: []
