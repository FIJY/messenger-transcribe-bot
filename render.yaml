services:
  # 1. Веб-сервис (Docker)
  - type: web
    name: messenger-transcribe-bot
    env: docker
    region: oregon
    # buildCommand и startCommand удалены, так как они управляются Dockerfile
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString
      - key: USE_TOR
        value: "true"
      - key: YT_PROXY
        value: "socks5://127.0.0.1:9050"
      - key: PYTHONPATH
        value: "/app" # Путь внутри Docker-контейнера

  # 2. Celery воркер (Стандартная среда Python)
  - type: worker
    name: celery-worker
    env: python # Исправлено с python3
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m services.render_worker_supervisor"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString
      - key: PYTHONPATH
        value: "/opt/render/project/src"
      - key: KHMER_PAYMENT_LISTENER_ENABLED
        value: "false"

  # 3. Redis
  - type: redis
    name: bot-redis
    maxmemoryPolicy: allkeys-lru
    # Добавлен IP allow list для разрешения подключений
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Allow all connections"
