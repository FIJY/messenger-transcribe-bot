services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # ===> ИЗМЕНЕНИЕ: Gunicorn -> Hypercorn <===
    startCommand: "hypercorn app:app -b 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  # ... (остальные сервисы - celery-worker, celery-beat, redis - без изменений) ...
  - type: worker
    name: celery-worker
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A celery_worker.celery_app worker --loglevel=info -c 1 --pool=solo"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
  - type: worker
    name: celery-beat
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A celery_worker.celery_app beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
  - type: redis
    name: bot-redis
    plan: free
    ipAllowList: []