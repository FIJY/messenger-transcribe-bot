services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    env: docker
    plan: standard
    # ИЗМЕНЕНИЕ: Подключаем группу с переменными окружения
    envVarGroups:
      - name: variables_bot # Убедитесь, что это имя совпадает с тем, что вы создали

  # 2. Воркер Celery
  - type: worker
    name: celery-worker
    env: docker
    plan: standard
    # ИЗМЕНЕНИЕ: Подключаем группу с переменными окружения
    envVarGroups:
      - name: variables_bot # Убедитесь, что это имя совпадает с тем, что вы создали

  # 3. Планировщик Celery (оставляем как есть)
  - type: worker
    name: celery-beat
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A celery_worker.celery_app beat --loglevel=info"
    # ИЗМЕНЕНИЕ: Подключаем группу и сюда, так как ему нужен REDIS_URL
    envVarGroups:
      - name: variables_bot
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  # 4. Redis
  - type: redis
    name: bot-redis
    plan: free
    ipAllowList: []
