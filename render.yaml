services:
  # 1. Веб-сервис
  - type: web
    name: messenger-transcribe-bot
    env: docker
    plan: standard
    # startCommand УДАЛЕН, так как это запрещено для Docker
    # Вместо него мы используем переменную окружения
    envVars:
      - key: PROCESS_TYPE
        value: web

  # 2. Воркер Celery
  - type: worker
    name: celery-worker
    env: docker
    plan: standard
    # startCommand УДАЛЕН
    envVars:
      - key: PROCESS_TYPE
        value: worker

  # 3. Планировщик Celery (оставляем как есть)
  - type: worker
    name: celery-beat
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A celery_worker.celery_app beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  # 4. Redis
  - type: redis
    name: bot-redis
    plan: free
    ipAllowList: []
